<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSBOOT | Instabilidade</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 1rem;
            border-bottom: 1px solid #334155;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .logo img {
            width: 50px;
            border-radius: 50%;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .card {
            max-width: 600px;
        }

        h1 {
            color: #f59e0b;
        }

        .box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #10b981;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 1rem;
            border-top: 1px solid #334155;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <img src="icone.png">
        POSBOOT<span style="color:#10b981;">_</span>
    </div>
</header>

<main>
    <div class="card">

        <h1>⚠️ Instabilidade detectada</h1>

        <p>
            Nosso servidor pode estar temporariamente indisponível.
        </p>

        <div class="box">
            ⚡ Possível queda de energia<br>
            🌐 Instabilidade de internet
        </div>

        <p style="margin-top:20px; color:#94a3b8;">
            A página tentará reconectar automaticamente.
        </p>

        <button onclick="location.reload()">
            Tentar novamente
        </button>

    </div>
</main>

<footer>
    © 2026 POSBOOT.com.br | Status automático
</footer>

<script>
setInterval(() => {
    location.reload();
}, 30000);
</script>

</body>
</html>
