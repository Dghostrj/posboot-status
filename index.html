<div id="status-box" style="margin-top:20px; font-size:14px; color:#94a3b8;">
    🔄 Tentando reconectar ao servidor... <br>
    ⏳ Próxima tentativa em <span id="countdown">5</span>s
</div>

<script>
let time = 5;
const countdownEl = document.getElementById("countdown");

async function checkServer() {
    try {
        // tenta acessar seu site principal
        const res = await fetch("https://posboot.com.br", {
            method: "HEAD",
            cache: "no-store"
        });

        if (res.ok) {
            return true;
        }
    } catch (e) {
        return false;
    }
    return false;
}

async function loop() {
    const isOnline = await checkServer();

    if (isOnline) {
        document.getElementById("status-box").innerHTML =
            "🟢 Servidor restaurado! Redirecionando...";

        setTimeout(() => {
            window.location.href = "https://posboot.com.br";
        }, 1000);

        return;
    }

    time--;
    countdownEl.textContent = time;

    if (time <= 0) {
        time = 5;
        location.reload();
    }

    setTimeout(loop, 1000);
}

loop();
</script>
